structure_authority:
  status: RESOLVED
  source: "Existing .github/workflows/backend-ci.yml consuming accepted root compose.yaml"
  rationale: "This is a path/contract alignment correction. The existing workflow and canonical Compose file are sufficient; no new CI framework, helper script, duplicate Compose file, or deployment abstraction is justified."

objective: "Restore Backend CI after TASK-0001 by making the existing workflow consume the canonical repository-root compose.yaml and current single-service Mongo topology, while preserving the workflow's existing quality/integration/build intent and avoiding duplicate Docker configuration."

scope:
  required_changes:
    - "Modify only .github/workflows/backend-ci.yml for implementation behavior."
    - "Replace every runtime reference to docker/mongodb/docker-compose.yml with the canonical repository-root compose.yaml."
    - "Remove stale mongo-init assumptions from readiness/logging/cleanup behavior; the canonical Compose project has only service mongo and performs idempotent replica-set initialization through its healthcheck."
    - "Keep the existing CI-specific Compose project isolation if still useful, but do not duplicate or fork compose.yaml merely for GitHub Actions."
    - "Add compose.yaml to the Backend CI push path filter so future canonical Mongo/Compose changes exercise the backend integration pipeline."
    - "Preserve the existing unit, env-sync, real Mongo integration, dependency-audit, and build gates; do not weaken or skip them to obtain green status."
    - "Before publication, statically verify the workflow has no remaining docker/mongodb/docker-compose.yml or mongo-init references and that its Compose commands resolve from repository root."
    - "Publish one bounded implementation commit on dev. The implementation push must trigger the existing Backend CI workflow; use that exact run as authoritative verification and require completed conclusion=success before publishing the separate report-only commit."
    - "Publish .agent/tasks/TASK-0003/report.yaml as a separate report-only child only after the authoritative workflow run passes, then stop at Governing Architect review. Do not mutate main."
  allowed_existing_files_or_components:
    - .github/workflows/backend-ci.yml
    - compose.yaml
    - .agent/tasks/TASK-0003/task.yaml
  expected_files_are_restrictive: true

invariants:
  - "compose.yaml remains the single canonical Compose definition for Elite Drive local/CI Mongo topology; no second Compose file is introduced."
  - "Backend CI retains its existing test, integration, audit, and build semantics except for the smallest corrections required to consume canonical Compose."
  - "No application source, Prisma schema, package dependency, Docker image definition, Cloud Run, Cloud Build, Artifact Registry, frontend, or production deployment behavior changes."
  - "No mongo-init/helper/bootstrap container is reintroduced."
  - "The authoritative implementation-candidate Backend CI run completes successfully; a partial run or locally green subset is insufficient."
  - "main remains 89e298c5268704d0d9fdeb9f574c6d896aaa35ab and branch topology remains exactly {dev, main}."

forbidden_changes:
  - "Do not restore docker/mongodb/docker-compose.yml."
  - "Do not add a CI-only Compose duplicate, shell orchestration framework, service wrapper, Docker management abstraction, or new dependency."
  - "Do not remove/disable the real Mongo integration tests, production dependency audit, or final build step."
  - "Do not change application behavior to make CI pass."
  - "Do not add deployment automation, Cloud Build, Cloud Run, Artifact Registry, or GitHub Actions deployment."
  - "Do not merge, rebase, force-push, reconcile dev/main divergence, or mutate main."

