artifact_contract:
  repository_name: elite-drive
  image_name: elite-drive
  tag: "${SOURCE_SHA}"
  canonical_identity: "${LOCATION}-docker.pkg.dev/${PROJECT_ID}/elite-drive/elite-drive@${REMOTE_DIGEST}"
  source_identity:
    requirement: "SOURCE_SHA equals the clean exact execution-base dev HEAD immediately before build and remains unchanged through publication."
    oci_label: "org.opencontainers.image.revision=${SOURCE_SHA}"
  repository_policy:
    format: DOCKER
    mode: STANDARD_REPOSITORY
    immutable_tags: true
    append_only_consequence_accepted: true
  deployment_consumer_rule: "Future TASK-0008 may consume only the verified canonical @sha256 digest recorded by this task; it must never rebuild source or deploy by tag."

invariants:
  - "dev is the only writable Git branch for this task."
  - "main remains exactly 7b4b45fdf3f9ade55f7f6ecf549a02e0d41e3cbf and is not checked out for work, mutated, merged, rebased, reconciled, promoted, or pushed."
  - "Branch topology remains exactly {dev, main}."
  - "SOURCE_SHA is the exact clean execution-base HEAD and origin/dev must equal SOURCE_SHA before build."
  - "No repository implementation file changes are authorized; only the eventual TASK-0007 report is persisted after successful or side-effect-requiring terminal execution."
  - "Vercel automatic Git deployments remain disabled on dev."
  - "m3-repoworker and /Users/tienphat/Developer/.agent-scratch are not used or referenced."
  - "No docker buildx command, custom builder, multi-platform manifest, Cloud Build, GitHub Actions image publication, Vercel deployment, Cloud Run deployment, Terraform, Kubernetes, or alternate deployment framework is used."
  - "linux/amd64 cross-architecture build/emulation is authorized only inside this publication task and does not change the native-ARM local development contract."
  - "Artifact Registry project/location are uniquely resolved from live elite-drive-api service evidence, never guessed from historical URLs or ambient config."
  - "Remote Artifact Registry describe is canonical digest authority."
  - "No production database mutation or Cloud Run traffic occurs."

forbidden_changes:
  - "Do not mutate main under any circumstance."
  - "Do not change server/Dockerfile, compose.yaml, application source, package files, lockfiles, workflows, frontend, deployment configuration, or vercel.json."
  - "Do not add build/push scripts, Makefiles, CI publication workflows, deployment wrappers, infrastructure-as-code, worker/sandbox layers, or another Compose stack."
  - "Do not use latest or any mutable/non-SOURCE_SHA tag."
  - "Do not disable immutable tags, move an existing immutable tag, delete a remote tagged artifact to make a retry easier, or repurpose an incompatible Artifact Registry repository."
  - "Do not grant project IAM roles, broaden principal permissions, create service accounts, or mutate unrelated GCP resources. Permission failure is BLOCKED."
  - "Do not run docker system prune, image prune, volume prune, network prune, or unrelated local Docker cleanup."

