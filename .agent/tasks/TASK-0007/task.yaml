acceptance_criteria:
  - id: AC-1
    requirement: "Publication source identity is exact and clean."
    evidence_required: "Fresh pre-build read-back proves branch dev, HEAD==origin/dev==SOURCE_SHA==authorized execution base, clean index/worktree, main frozen, topology {dev, main}, and Vercel deploymentEnabled=false."
  - id: AC-2
    requirement: "GCP project and location are uniquely resolved from live elite-drive-api authority."
    evidence_required: "Executor records the discovery method and exactly one PROJECT_ID/LOCATION result; zero/multiple viable matches or ambient-config inference are absent."
  - id: AC-3
    requirement: "Artifact Registry repository is compatible, private, standard Docker, and immutable."
    evidence_required: "Remote repository describe proves repository elite-drive at explicit project/location with Docker format, standard mode, immutable tags enabled; report states whether it was pre-existing or created."
  - id: AC-4
    requirement: "Pre-push candidate is the clean source SHA's Cloud Run-compatible amd64 image."
    evidence_required: "docker build --platform linux/amd64 succeeds without docker buildx/custom builder/multi-platform publication; inspection proves amd64, tini entrypoint, Node command, configured non-root user, OCI revision SOURCE_SHA, runtime UID!=0; local health/live and health/ready database=ok pass against non-production Mongo."
  - id: AC-5
    requirement: "Immutable SHA tag is published or safely reused and registry resolves the canonical digest."
    evidence_required: "Exactly IMAGE:SOURCE_SHA is pushed if absent, or existing immutable tag is reused without repush; Artifact Registry remote describe returns one sha256 digest recorded as REMOTE_DIGEST."
  - id: AC-6
    requirement: "Exact digest round-trip passes independent runtime verification."
    evidence_required: "After local candidate reference removal, docker pull IMAGE@REMOTE_DIGEST succeeds; inspection proves amd64/tini/Node/non-root/OCI revision SOURCE_SHA, runtime UID!=0, and final health/live + health/ready database=ok pass against non-production Mongo."
  - id: AC-7
    requirement: "Local and credential hygiene remain bounded."
    evidence_required: "Task-owned containers/networks/temp tags/auth material/disposable data are removed, canonical persistent volume is preserved as applicable, no host-wide prune occurs, and no unrelated operator Docker or credential state is deleted."
  - id: AC-8
    requirement: "Git authority and deployment boundary remain intact."
    evidence_required: "No implementation commit exists; report is the only child commit created by execution, dev only; main remains exact frozen SHA; no Cloud Run deploy, Cloud Build, Vercel deploy, GitHub Actions publication, IAM broadening, or production DB mutation occurs."
  - id: AC-9
    requirement: "Future deployment has an immutable trust handoff."
    evidence_required: "Canonical report records SOURCE_SHA, PROJECT_ID, LOCATION, repository, IMAGE:SOURCE_SHA, REMOTE_DIGEST, canonical IMAGE@REMOTE_DIGEST, OCI revision proof, and round-trip PASS; task explicitly states future Cloud Run work must consume that digest only and never rebuild/deploy tag."

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "Fresh fetch/read-back; require local dev HEAD exactly authorized base and origin/dev, clean index/worktree, accepted TASK-0006 review, main exact frozen SHA, topology {dev, main}, vercel.json deploymentEnabled=false. Capture SOURCE_SHA from git rev-parse HEAD only after all checks pass."
      required: true
    - id: CHECK-2
      command_or_check: "Verify Agent Runtime, Docker CLI, Compose v2, OrbStack, gcloud authentication, Cloud Run read, Artifact Registry read/create/push capabilities. Permission gaps fail closed; do not grant IAM."
      required: true
    - id: CHECK-3
      command_or_check: "Fresh-resolve elite-drive-api across accessible GCP project scope; require exactly one viable PROJECT_ID/LOCATION. Re-run explicit service describe with both resolved values and record evidence."
      required: true
    - id: CHECK-4
      command_or_check: "Explicitly inspect Artifact Registry API and repository elite-drive in resolved project/location. Enable only artifactregistry.googleapis.com if needed. Create repository only if absent with Docker format + immutable tags; otherwise verify exact compatibility and block on mismatch."
      required: true
    - id: CHECK-5
      command_or_check: "Construct explicit IMAGE=${LOCATION}-docker.pkg.dev/${PROJECT_ID}/elite-drive/elite-drive and TAG=${SOURCE_SHA}. Check remote IMAGE:TAG before push and record absent/existing state."
      required: true
    - id: CHECK-6
      command_or_check: "Build single-platform amd64 candidate with docker build --platform linux/amd64, SOURCE_SHA OCI label, and only SOURCE_SHA remote tag plus any bounded temporary local alias required for smoke. Do not invoke docker buildx/custom builder. Inspect image contract and runtime UID, then pass pre-push local health/database smoke."
      required: true
    - id: CHECK-7
      command_or_check: "If SHA tag absent, authenticate with bounded credential handling and push exactly IMAGE:SOURCE_SHA. If tag exists, do not repush. Resolve REMOTE_DIGEST from Artifact Registry remote describe; require sha256 digest and record immutable source binding."
      required: true
    - id: CHECK-8
      command_or_check: "Remove local candidate tag/reference, pull exact IMAGE@REMOTE_DIGEST, inspect architecture/entrypoint/cmd/user/OCI revision/runtime UID, and run final non-production health + database smoke using the exact digest-pulled image."
      required: true
    - id: CHECK-9
      command_or_check: "Clean bounded task-owned local Docker/auth/disposable state, preserve unrelated resources and canonical Mongo volume, then fresh-read remote tag/digest again to prove unchanged immutable binding."
      required: true
    - id: CHECK-10
      command_or_check: "Publish canonical TASK-0007 report as the sole execution-created Git commit on dev. Fresh post-publication read-back must prove local HEAD==origin/dev==report SHA, report parent==SOURCE_SHA, worktree clean, main frozen, topology {dev, main}, Vercel kill switch intact, canonical remote digest still resolves, and no task-owned local residue."
      required: true
  authoritative_verification:
    required: true
    mechanism: "Clean exact dev source identity + pre-push amd64 local smoke + immutable Artifact Registry remote digest resolution + exact digest pull/inspect/runtime smoke + post-publication remote/read-back evidence"
    expected_signal: "One clean SOURCE_SHA maps to one immutable remote sha256 digest; the pulled digest is amd64, tini-based, non-root, source-labeled, healthy against non-production Mongo, and no deployment occurs."

side_effect_reporting:
  irreversible_remote_side_effects:
    - "Artifact Registry repository elite-drive may be created with immutable tags."
    - "IMAGE:SOURCE_SHA may become an immutable append-only remote tag and remain even if a later verification step blocks."
  requirement: "Once any irreversible remote side effect occurs, terminal reporting must record its exact project/location/repository/tag/digest state even when result is BLOCKED. Do not hide, roll back by weakening immutability, or mutate main."

