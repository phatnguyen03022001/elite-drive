structure_authority:
  status: RESOLVED
  source: "Accepted TASK-0006 image plus operator-approved publication boundary"
  rationale: "No repository implementation change is required. OCI source revision metadata is injected at build time with Docker's label option, while the immutable remote Artifact Registry digest becomes the canonical deployment artifact identity."

objective: "Publish exactly one verified linux/amd64 backend image candidate from a clean exact dev source SHA into a uniquely resolved private immutable Artifact Registry repository, resolve its canonical digest from the registry, pull and verify that exact digest round-trip, and record the source-to-digest binding without deploying Cloud Run or mutating main."

scope:
  required_changes:
    - "Perform no application, Dockerfile, Compose, workflow, frontend, or deployment-code mutation. The exact execution-base dev HEAD is the SOURCE_SHA and must remain the build source identity."
    - "Before any build or external mutation, require branch dev, HEAD exactly equal to the authorized execution base, clean index/worktree, origin/dev equal to HEAD after fresh fetch, main exactly frozen, topology exactly {dev, main}, and vercel.json git.deploymentEnabled=false. Dirty or stale state is BLOCKED."
    - "Fresh-resolve the existing Cloud Run service named elite-drive-api through gcloud across accessible project scope without inferring project or region from gcloud defaults. Require exactly one viable service identity yielding one explicit PROJECT_ID and LOCATION. Zero or multiple viable matches are BLOCKED."
    - "After resolution, every Artifact Registry command must pass explicit --project and --location values derived from that unique service identity. Do not rely on ambient gcloud project/region configuration."
    - "Ensure Artifact Registry API availability only in the resolved project. If artifactregistry.googleapis.com is disabled, enabling exactly that API is authorized; do not enable unrelated APIs."
    - "Use standard private Docker repository name elite-drive in the resolved project/location. If absent, create it with repository format Docker and immutable tags enabled. If present, verify it is a standard Docker repository with immutable tags enabled. Any format/mode/location/immutability mismatch is BLOCKED; do not repurpose or mutate an incompatible existing repository."
    - "Accept the append-only consequence of immutable tags: once SOURCE_SHA is attached to a digest, the tag cannot be moved or removed, and a post-push failed candidate may remain for audit. Do not weaken repository immutability to simplify cleanup."
    - "Use image name elite-drive and tag exactly SOURCE_SHA. Never use latest, mutable aliases, branch tags, timestamp tags, or release tags in this task."
    - "Build exactly one single-platform linux/amd64 candidate using docker build --platform linux/amd64 from server/. Do not invoke docker buildx, do not create or select a custom builder, and do not publish a multi-platform manifest. Underlying Docker BuildKit/Buildx implementation semantics are not prohibited."
    - "Inject OCI metadata at build time without repository source changes, including org.opencontainers.image.revision=SOURCE_SHA."
    - "Before push, inspect the candidate and require Architecture=amd64, expected tini entrypoint, expected Node command, configured non-root user, OCI revision label equal to SOURCE_SHA, and runtime UID not equal to 0."
    - "Run a local pre-push smoke of the exact amd64 candidate against only local/non-production Mongo infrastructure. Require /health/live success, /health/ready database=ok, and no production Cloud Run or production database access."
    - "If remote tag IMAGE:SOURCE_SHA does not exist, authenticate to the resolved Artifact Registry with the smallest bounded mechanism and push exactly that tag. Do not push any other tag."
    - "If remote tag IMAGE:SOURCE_SHA already exists, do not repush or move it. Resolve the existing remote digest and continue round-trip verification. If its source revision metadata or verified runtime contract does not bind to SOURCE_SHA, BLOCKED."
    - "After push or existing-tag detection, resolve the canonical digest from the remote Artifact Registry tag using Artifact Registry remote describe semantics. Local Docker metadata is not canonical digest authority."
    - "Remove local candidate tag/reference as needed, then docker pull the exact IMAGE@sha256:... reference resolved from Artifact Registry. Cached layers may be reused; docker system prune is neither required nor allowed."
    - "Inspect the pulled exact digest and require Architecture=amd64, expected tini entrypoint, expected Node command, configured non-root user, OCI revision label equal to SOURCE_SHA, and runtime UID not equal to 0."
    - "Run final health + database smoke using the exact digest-pulled image and only local/non-production Mongo infrastructure. Require /health/live success and /health/ready database=ok."
    - "Clean task-owned local containers, network aliases, temporary tags, candidate image references, temporary auth material, and disposable local data without host-wide prune. Preserve the canonical elite-drive-mongo-data volume unless execution explicitly used disposable isolated storage."
    - "Publish one canonical report-only commit on dev recording SOURCE_SHA, resolved project, location, repository, immutable SHA tag, canonical digest, whether repository/image existed or was created/pushed, and exact round-trip verification evidence. No implementation commit is authorized."
    - "If an irreversible remote artifact/repository mutation occurred and later verification blocks, still preserve auditable evidence of the side effect in the terminal report rather than deleting or weakening immutable state."
  allowed_existing_files_or_components:
    - server/Dockerfile
    - server/.dockerignore
    - compose.yaml
