structure_authority:
  status: RESOLVED
  source: "Existing Dockerfile and root compose.yaml"
  rationale: "The defect is image PID1/signal portability. The smallest correction is an image-native init process plus removal of the redundant Compose-only init flag; no application lifecycle redesign or deployment framework is justified."

objective: "Make the accepted Elite Drive backend OCI image handle TERM correctly as a standalone container by carrying its own minimal init/signal-forwarding boundary, eliminating reliance on Compose init:true while preserving the canonical two-container OrbStack topology and all application behavior."

scope:
  required_changes:
    - "Modify the existing backend image with the smallest standard image-native init/signal-forwarding mechanism. Prefer the Debian tini package already compatible with node:24-bookworm-slim unless fresh execution evidence proves a simpler equivalent."
    - "Make the image entrypoint invoke the init process and keep the existing Node compiled application command as its child."
    - "Remove compose.yaml init:true from the app service after the image itself owns PID1/signal forwarding."
    - "Do not change container names, project name, ports, Mongo networking, database URL, persistent volume identity, or default local development environment behavior."
    - "Build and run the canonical project directly through Agent Runtime and OrbStack. Prove elite-drive contains the image-native init as PID1 with Node as its child and no extra helper/init container."
    - "Prove a controlled docker/compose stop delivers TERM through the image-native init and the app container exits without forced SIGKILL; require an exit consistent with SIGTERM or clean graceful shutdown and no duplicate/orphan process/container."
    - "Restart/start the canonical project and require /health/live and /health/ready database=ok to recover."
    - "Run docker compose down and preserve elite-drive-mongo-data. Remove any task-built disposable image/tag or other task-owned Docker residue without host-wide prune."
    - "Run the normal authorized backend verification surface and require Backend CI for the exact implementation SHA to complete conclusion=success with every required gate successful."
    - "Publish exactly one implementation commit on dev, then a separate report-only child, and stop at Governing Architect review."
  allowed_existing_files_or_components:
    - server/Dockerfile
    - compose.yaml
    - server/package.json
    - server/package-lock.json
    - .github/workflows/backend-ci.yml
    - vercel.json
    - .agent/tasks/TASK-0006/task.yaml
  expected_files_are_restrictive: false

