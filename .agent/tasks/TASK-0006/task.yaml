acceptance_criteria:
  - id: AC-1
    requirement: "PID1/signal forwarding belongs to the image rather than Compose."
    evidence_required: "Dockerfile contains the minimal image-native init entrypoint; compose.yaml no longer uses init:true; running elite-drive process inventory proves init PID1 and Node child without another container."
  - id: AC-2
    requirement: "Standalone container TERM behavior no longer requires forced SIGKILL."
    evidence_required: "Controlled stop of elite-drive exits from TERM/clean shutdown within the normal grace period, not 137, with no duplicate/orphan app process or container."
  - id: AC-3
    requirement: "Canonical local topology and health remain intact."
    evidence_required: "Running inventory is exactly {elite-drive, elite-drive-mongo}; Mongo is usable; /health/live succeeds and /health/ready returns database=ok before and after restart."
  - id: AC-4
    requirement: "Local lifecycle cleanup remains bounded."
    evidence_required: "compose down removes project containers/network, preserves elite-drive-mongo-data, and no task-owned Docker residue remains; no host-wide prune is used."
  - id: AC-5
    requirement: "Existing backend quality gates remain green."
    evidence_required: "Authorized local backend verification passes and Backend CI for exact implementation SHA completes conclusion=success with all required steps successful."
  - id: AC-6
    requirement: "Publication and branch authority remain bounded."
    evidence_required: "Exactly one implementation commit on dev changes only server/Dockerfile and compose.yaml; report is a separate report-only child; main remains exact frozen SHA and topology exactly {dev, main}."

