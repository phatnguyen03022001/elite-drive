acceptance_criteria:
  - id: AC-1
    requirement: "Production cannot boot with ephemeral upload storage."
    evidence_required: "Focused tests prove NODE_ENV=production with CLOUDINARY_ENABLED missing or false is rejected by validateEnvironment with a deterministic non-secret-bearing configuration error."
  - id: AC-2
    requirement: "The existing durable-provider credential gate remains fail closed."
    evidence_required: "Focused tests prove production with CLOUDINARY_ENABLED=true but any required Cloudinary credential missing is rejected, while a production configuration with all required Cloudinary credentials and existing core production keys is accepted."
  - id: AC-3
    requirement: "Local development fallback is preserved."
    evidence_required: "Focused tests prove a non-production configuration with CLOUDINARY_ENABLED=false remains valid; no UploadService or CloudinaryUploadService implementation file changes."
  - id: AC-4
    requirement: "Operator-facing configuration matches runtime truth."
    evidence_required: "server/.env.example states Cloudinary is required in production and local filesystem upload settings are local-development fallback only; no text implies ephemeral local storage is an acceptable production mode."
  - id: AC-5
    requirement: "Existing backend behavior remains regression-safe."
    evidence_required: "Backend CI run triggered by the exact implementation commit completes with conclusion=success and all required quality, unit, environment-sync, Mongo integration, production-dependency-audit, and build gates successful."
  - id: AC-6
    requirement: "Correction remains minimal and publication bounded."
    evidence_required: "Implementation diff is restricted to server/src/config/env-contract.ts, server/src/config/env-contract.spec.ts, and server/.env.example; report is a separate report-only child; main remains unchanged and topology exactly {dev, main}."

