structure_authority:
  status: RESOLVED
  source: "Existing validateEnvironment startup gate plus existing CloudinaryUploadService provider path"
  rationale: "This is a bounded production-safety correction. The repository already has the required provider and startup validation seam; adding StoragePort, a new provider adapter, R2/S3, Docker persistence, or another abstraction would be unnecessary scope expansion."

objective: "Make Elite Drive fail closed at startup when production would otherwise use ephemeral local filesystem upload storage, while preserving the existing local-development fallback and existing Cloudinary implementation without redesigning storage."

scope:
  required_changes:
    - "Modify the existing environment contract so NODE_ENV=production is rejected unless CLOUDINARY_ENABLED is explicitly true. Missing, false, malformed, or otherwise disabled Cloudinary configuration must not be accepted as a valid production startup state."
    - "Preserve the existing Cloudinary provider credential checks: when CLOUDINARY_ENABLED=true, CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, and CLOUDINARY_API_SECRET remain required."
    - "Preserve development/test behavior: Cloudinary may remain disabled outside production and UploadService may continue using the existing local filesystem fallback there."
    - "Remove or correct production diagnostics/documentation that describe ephemeral local filesystem fallback as a supported production operating mode."
    - "Update the focused environment-contract tests so they prove production with Cloudinary disabled is rejected, production with Cloudinary enabled but incomplete credentials is rejected, production with complete Cloudinary configuration is accepted, and non-production with Cloudinary disabled remains accepted."
    - "Update server/.env.example so Cloudinary is documented as optional for local development but mandatory for production, while UPLOAD_DIR/UPLOAD_PUBLIC_BASE_URL are clearly local-fallback settings rather than a production durability mechanism."
    - "Do not change UploadService or CloudinaryUploadService behavior unless execution proves the startup contract cannot enforce the requirement; such a need is outside this revision and must fail closed rather than expand scope."
    - "Run focused environment-contract verification before publication, then publish one bounded implementation commit on dev. The implementation push must trigger Backend CI; require the exact implementation-SHA Backend CI run to complete successfully before publishing the separate report-only child."
    - "Publish .agent/tasks/TASK-0004/report.yaml as a separate report-only child only after authoritative verification passes, then stop at Governing Architect review. Do not mutate main."
  allowed_existing_files_or_components:
    - server/src/config/env-contract.ts
    - server/src/config/env-contract.spec.ts
    - server/.env.example
    - .agent/tasks/TASK-0004/task.yaml
  expected_files_are_restrictive: true

invariants:
  - "The existing CloudinaryUploadService remains the production image-storage provider for this task; no provider migration or storage-interface redesign occurs."
  - "Local filesystem upload fallback remains available outside production for current development/test workflows."
  - "Production must never validate successfully while uploads would route to local filesystem fallback."
  - "Existing environment validation for DATABASE_URL, JWT/OTP secrets, PLATFORM_USER_ID, Brevo, MoMo, ports, BCRYPT_ROUNDS, URL syntax, and unknown managed keys remains intact except for the smallest consistency edits caused by the Cloudinary production rule."
  - "No application endpoint, upload API contract, media locator format, KYC security behavior, database schema, payment behavior, email behavior, frontend behavior, Docker/Compose topology, deployment mechanism, or dependency set changes."
  - "The authoritative implementation-candidate Backend CI run completes successfully; a partial or local-only green result is insufficient."
  - "main remains 89e298c5268704d0d9fdeb9f574c6d896aaa35ab and branch topology remains exactly {dev, main}."

forbidden_changes:
  - "Do not add StoragePort, repository/provider abstractions, object-storage facades, adapters, queues, workers, background migration logic, or a second image-storage provider."
  - "Do not introduce Cloudflare R2, S3, GCS, mounted volumes, persistent Docker volumes for uploads, or production local-disk persistence."
  - "Do not modify server/src/modules/upload/upload.service.ts, server/src/modules/upload/cloudinary-upload.service.ts, upload controllers, upload DTOs, or KYC media behavior in this revision."
  - "Do not add or update package dependencies or lockfiles."
  - "Do not modify compose.yaml, Dockerfiles, Cloud Run, Cloud Build, Artifact Registry, GitHub Actions workflow definitions, Vercel configuration, or deployment automation."
  - "Do not weaken existing tests or environment validation to obtain green status."
  - "Do not merge, rebase, force-push, reconcile dev/main divergence, or mutate main."

