structure_authority:
  status: RESOLVED
  source: "Existing backend package/runtime contract plus accepted root compose.yaml"
  rationale: "This is a bounded containerization of an existing backend and existing Compose project. Plain Dockerfile, .dockerignore, and the current root Compose file are sufficient; no worker repository, execution framework, deployment framework, generated wrapper, or secondary Compose stack is justified."

objective: "Materialize the Elite Drive backend as the primary local OrbStack application container named elite-drive inside the canonical elite-drive Compose project, alongside accepted supporting container elite-drive-mongo, using a minimal production-capable OCI image and direct Agent Runtime execution against the operator's actual repository checkout."

scope:
  required_changes:
    - "Add the smallest production-capable backend Docker image definition for the existing NestJS server. Prefer server/Dockerfile and server/.dockerignore unless fresh repository evidence proves a different build context is materially simpler."
    - "Use a multi-stage build or equivalently minimal image structure that installs from the canonical lockfile, generates Prisma client as needed, compiles the existing application, and excludes development/build-only material from the runtime image where practical without adding framework complexity."
    - "Do not force an explicit Docker platform in this local task. Build for the host/default OrbStack platform; do not introduce --platform, buildx orchestration, cross-build, emulation, or multi-architecture publication logic."
    - "Extend canonical root compose.yaml with exactly one primary application service whose persistent container identity is elite-drive. Preserve project name elite-drive and supporting Mongo container elite-drive-mongo."
    - "The local app container must reach Mongo through Compose service networking rather than localhost and must wait for or otherwise fail cleanly until the accepted Mongo service is usable."
    - "Local Compose execution may run the compiled image in non-production mode so CLOUDINARY_ENABLED=false local filesystem fallback remains usable without production provider credentials. The image itself must remain suitable for later production execution without embedding secrets or local-only paths."
    - "Expose the existing backend local port with the smallest stable mapping consistent with current PORT/APP_PORT behavior. Do not change application source solely for containerization if existing runtime contract is sufficient."
    - "Ensure build context hygiene excludes secrets and local/generated garbage such as .env files, node_modules, dist, coverage, uploads, logs, Git metadata, and similar non-image inputs."
    - "Correct the stale server/.env.example comment that still references removed docker/mongodb/docker-compose.yml; it must point to the canonical root compose.yaml or otherwise describe the current local Mongo contract accurately."
    - "Using direct Agent Runtime execution in /Users/tienphat/Developer/elite-drive, build the image and run the canonical Compose project in OrbStack. Prove the final running Elite Drive topology contains exactly the primary elite-drive application container plus accepted elite-drive-mongo supporting container, with no helper/init/worker container."
    - "Verify GET /health/live succeeds from the host and GET /health/ready succeeds with database=ok while both canonical containers are running."
    - "Verify the app container survives a controlled restart and returns to liveness/readiness without manual database repair. Exercise normal stop/TERM behavior sufficiently to prove no runaway process or duplicate container is left behind."
    - "Verify docker compose down removes the Elite Drive app container and project network while preserving elite-drive-mongo-data by default; do not remove operator data volume unless a task-owned disposable reset is explicitly required for verification."
    - "After local Docker/OrbStack verification, run the normal authorized backend verification surface and require the Backend CI run for the exact implementation SHA to complete with conclusion=success before publishing the report."
    - "Publish exactly one bounded implementation commit on dev, then publish .agent/tasks/TASK-0005/report.yaml as a separate report-only child and stop at Governing Architect review. Do not mutate main."
  allowed_existing_files_or_components:
    - compose.yaml
    - server/package.json
    - server/package-lock.json
    - server/prisma
    - server/src
    - server/.env.example
    - .github/workflows/backend-ci.yml
    - .agent/tasks/TASK-0005/task.yaml
  expected_files_are_restrictive: false

