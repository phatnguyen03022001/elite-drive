acceptance_criteria:
  - id: AC-1
    requirement: "Elite Drive has one canonical local application container identity."
    evidence_required: "docker compose config resolves project elite-drive and app container elite-drive; clean running inventory contains exactly elite-drive and elite-drive-mongo for the project and no helper/worker/init container."
  - id: AC-2
    requirement: "The backend image is reproducible from repository inputs without embedding local secrets or garbage."
    evidence_required: "Fresh local image build exits 0 using the canonical lockfile/build contract; .dockerignore excludes local secrets/generated directories; image inspection/history and build context evidence reveal no committed or copied .env secret material."
  - id: AC-3
    requirement: "The application container uses the accepted Compose database service correctly."
    evidence_required: "Container configuration uses service-network database addressing rather than localhost; Mongo reaches accepted replica-set readiness and the app starts without changing Prisma schema or application database logic."
  - id: AC-4
    requirement: "Containerized backend is live and database-ready."
    evidence_required: "Host smoke checks against running canonical project return success for /health/live and /health/ready, with ready response proving database=ok."
  - id: AC-5
    requirement: "Local lifecycle is clean and restart-safe."
    evidence_required: "Controlled app restart returns to liveness/readiness; normal compose down removes elite-drive, elite-drive-mongo, and the project network while preserving elite-drive-mongo-data; no task-owned helper/orphan container or network remains."
  - id: AC-6
    requirement: "Local execution path remains direct and minimal."
    evidence_required: "Executor report proves Agent Runtime operated directly in /Users/tienphat/Developer/elite-drive; no .agent-scratch or m3-repoworker path/resource was used or created."
  - id: AC-7
    requirement: "Current operator-facing local environment documentation matches canonical Compose truth."
    evidence_required: "server/.env.example no longer references docker/mongodb/docker-compose.yml and accurately describes root compose.yaml/local Mongo behavior without weakening production Cloudinary requirements."
  - id: AC-8
    requirement: "Existing backend quality gates remain green."
    evidence_required: "Required local backend verification passes and Backend CI triggered by exact implementation commit completes conclusion=success with all required quality, environment, Mongo integration, audit, cleanup, and build steps successful."
  - id: AC-9
    requirement: "Publication remains bounded."
    evidence_required: "Exactly one implementation commit is published to dev; implementation diff contains only authorized Docker/Compose/environment-doc surface; report is a separate report-only child; main is unchanged and topology remains exactly {dev, main}."

