structure_authority:
  status: RESOLVED
  source: "Existing Jest CustomerBookingService unit test file"
  rationale: "The reproduced defect is test-clock nondeterminism. The smallest correction belongs entirely in the existing unit spec; no production clock abstraction or shared test framework is justified."

objective: "Make the three CustomerBookingService booking tests time-deterministic so the backend unit suite remains green as wall-clock time advances, without changing production booking semantics or adding a clock abstraction/framework."

scope:
  required_changes:
    - "Modify only server/src/modules/customer/customer-booking.service.spec.ts for implementation behavior."
    - "Freeze Jest/system time within this describe scope to a fixed instant before the existing September 1-3, 2026 fixture dates, and reliably restore real timers/system time after the tests. Prefer the smallest existing Jest-native mechanism."
    - "Preserve the existing booking fixture dates and assertions unless a minimal local adjustment is required for correct timer setup/cleanup."
    - "Do not modify CustomerBookingService production code, DTOs, Prisma schema, shared date utilities, global Jest configuration, or application behavior."
    - "Run the focused CustomerBookingService spec and then the full backend unit suite; the previously failing three cases and full suite must pass."
    - "Run the normal backend build gate if it is reasonably available from the exact execution candidate; record any unrelated external/environment blocker truthfully rather than expanding scope."
    - "Publish one bounded implementation commit on dev followed by a separate .agent/tasks/TASK-0002/report.yaml report-only commit, then stop at Governing Architect review. Do not mutate main."
  allowed_existing_files_or_components:
    - server/src/modules/customer/customer-booking.service.spec.ts
    - .agent/tasks/TASK-0002/task.yaml
  expected_files_are_restrictive: true

invariants:
  - "Production booking semantics remain byte-for-byte unchanged."
  - "No production clock abstraction, dependency injection seam, shared fake-time helper, or new dependency is introduced."
  - "The tests do not depend on the operator's current calendar date after correction."
  - "No Docker/Compose, Cloud Run, Cloud Build, Artifact Registry, frontend, upload, or branch-reconciliation behavior changes."
  - "Branch topology remains exactly {dev, main}; main remains 89e298c5268704d0d9fdeb9f574c6d896aaa35ab."

forbidden_changes:
  - "Do not weaken or remove the production past-booking guard."
  - "Do not replace fixed dates with Date.now()+N style wall-clock-relative fixtures when Jest fake/system time can make the existing fixture deterministic."
  - "Do not introduce a Clock service, date library, global test setup, or framework-level abstraction for three local tests."
  - "Do not modify compose.yaml or any TASK-0001 artifact."
  - "Do not merge, rebase, force-push, reconcile dev/main divergence, or mutate main."

