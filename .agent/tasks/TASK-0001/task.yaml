structure_authority:
  status: RESOLVED
  source: "Existing Docker Compose local-Mongo flow, collapsed to one repository-root Compose project."
  rationale: "The repository already uses Docker only for local MongoDB. This task changes naming, ownership, and cleanup semantics without introducing a production application image or another orchestration layer."

objective: "Normalize Elite Drive local Docker/OrbStack ownership so the repository has exactly one Compose application/project named elite-drive, local supporting containers use the elite-drive-<service> namespace, the Mongo replica-set bootstrap does not leave a separate mongo-init container behind, and normal start/stop/reset flows leave no orphaned project/container artifacts."

scope:
  required_changes:
    - "Replace the nested docker/mongodb Compose entry point with one canonical repository-root Compose file whose explicit Compose project name is elite-drive."
    - "Keep TASK-0001 local-development-only. Do not add the production backend Dockerfile, frontend Dockerfile, Cloud Run configuration, Artifact Registry configuration, Cloud Build configuration, or deployment automation."
    - "Define the local MongoDB service under the single elite-drive project with deterministic container identity elite-drive-mongo."
    - "Remove the separate mongo-init one-shot container. Replica-set initialization must become idempotent without leaving an additional exited bootstrap container visible in OrbStack after startup. Prefer the smallest Compose/Mongo-native mechanism; do not add a bootstrap service, daemon, scheduler, or helper container under another name."
    - "Stop using repository bind-mounted docker/mongodb/mongo-data as implicit runtime state. Use one explicit Docker-managed named volume with deterministic Elite Drive ownership so database runtime state does not dirty the Git checkout."
    - "Provide a normal lifecycle where startup creates/uses only the elite-drive project and its intended service containers, ordinary stop/down removes runtime containers and networks, and an explicit reset path can additionally remove the Elite Drive Mongo data volume."
    - "Inspect the operator Mac through Agent Runtime before cleanup. Remove only stale Docker/Compose resources that are unambiguously owned by this Elite Drive legacy topology. Never delete unrelated containers, images, volumes, projects, or networks and never use broad Docker prune commands."
    - "After migration, verify docker compose ls / docker ps -a / relevant volume and network listings show no legacy Elite Drive Compose project, no mongo-init container, no orphaned Elite Drive service container, and no random project/container naming."
    - "Document the canonical local Docker commands minimally in README or the existing local-development documentation: start, status/logs if needed, stop, and full data reset."
    - "Preserve all current application runtime behavior outside local Mongo container ownership. No application feature, schema, authentication, payment, upload, frontend, or production-hosting behavior may change."
    - "Publish one bounded implementation lineage on dev followed by a separate .agent/tasks/TASK-0001/report.yaml evidence commit, then stop at Governing Architect review. Do not mutate main."

naming_contract:
  compose_project: elite-drive
  future_primary_application_container: elite-drive
  supporting_container_pattern: elite-drive-<service>
  task_0001_expected_persistent_service_container:
    - elite-drive-mongo
  forbidden_examples:
    - mongodb-mongo-1
    - docker-mongo-1
    - elite-drive-mongo-init
    - random/hash-suffixed manually named Elite Drive projects

invariants:
  - "There is exactly one canonical Compose project for this repository: elite-drive."
  - "TASK-0001 leaves exactly one persistent local service container when the local database stack is running: elite-drive-mongo."
  - "No mongo-init/helper/bootstrap container remains after startup."
  - "No broad docker system prune, docker container prune, docker volume prune, or equivalent host-wide cleanup is used."
  - "No repository runtime-data directory is introduced or retained for MongoDB."
  - "Local Mongo data persistence is intentional Docker-managed state and can be removed only by the explicit Elite Drive reset operation."
  - "The task does not containerize frontend/backend application processes yet; the future primary app container name elite-drive is reserved by contract for the later OCI/container task."
  - "No production deployment provider or cloud service becomes required for local development."
  - "main is not modified."
  - "Branch topology remains exactly {dev, main}; existing branch divergence is not resolved, merged, rebased, force-pushed, or otherwise changed in TASK-0001."

forbidden_changes:
  - "Do not add Apple Sandbox, Kubernetes, Helm, Terraform, PM2, a Docker management framework, a custom container registry abstraction, or another local orchestrator."
  - "Do not add Cloud Build, GitHub Actions deployment, provider auto-deploy, Cloud Run, Artifact Registry, or production image publication in this task."
  - "Do not combine Next.js and NestJS processes merely to satisfy the future primary-container naming contract. Application container boundaries are outside TASK-0001."
  - "Do not delete unrelated operator Docker resources or use host-wide prune commands."
  - "Do not modify application source or Prisma schema."
  - "Do not mutate main, create/delete branches, rewrite history, or resolve existing dev/main divergence."

