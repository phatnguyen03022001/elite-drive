    - id: CHECK-2
      command_or_check: "Validate canonical Compose config and exact project/container/volume naming without starting services."
      required: true
    - id: CHECK-3
      command_or_check: "Start the canonical Elite Drive local database stack through Docker Compose on OrbStack; prove Mongo health and replica-set usability with no helper container remaining."
      required: true
    - id: CHECK-4
      command_or_check: "Run a bounded application/database connectivity smoke using the canonical local Mongo endpoint."
      required: true
    - id: CHECK-5
      command_or_check: "Exercise normal down and explicit reset semantics; inspect containers/projects/networks/volumes and git status after cleanup; prove no unrelated Docker resource was touched."
      required: true
    - id: CHECK-6
      command_or_check: "Verify final diff, no production/containerization scope spill, report-only lineage, unchanged main, and exact {dev, main} topology."
      required: true
