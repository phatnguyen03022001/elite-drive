acceptance_criteria:
  - id: AC-1
    requirement: "Elite Drive owns one deterministic OrbStack/Compose project."
    evidence_required: "On the operator Mac, canonical root Compose config resolves project name elite-drive; docker compose ls shows one Elite Drive project and no legacy Elite Drive project name."
  - id: AC-2
    requirement: "The local Mongo service has deterministic clean identity without helper-container garbage."
    evidence_required: "After clean startup, the only persistent Elite Drive database service container is elite-drive-mongo, it reaches healthy/usable replica-set state, and no mongo-init/bootstrap container remains in docker ps -a."
  - id: AC-3
    requirement: "Repository-local Docker runtime data does not dirty the checkout."
    evidence_required: "MongoDB uses a deterministic Docker-managed named volume; no docker/mongodb/mongo-data or replacement runtime-data directory is created; git status remains clean after start/use/stop."
  - id: AC-4
    requirement: "Lifecycle cleanup is bounded and leaves no orphaned Elite Drive runtime resources."
    evidence_required: "Normal down removes the Elite Drive runtime containers/network without deleting the intentional data volume; explicit reset additionally removes only the Elite Drive Mongo data volume; post-cleanup listings show no orphaned Elite Drive container/project/network."
  - id: AC-5
    requirement: "Cleanup never threatens unrelated operator Docker resources."
    evidence_required: "Executor records pre/post Docker resource inventory relevant to Elite Drive and proves no host-wide prune command or unrelated-resource deletion occurred."
  - id: AC-6
    requirement: "Existing local application behavior remains intact."
    evidence_required: "Mongo-backed application/database connectivity smoke passes using the canonical local connection contract, with no application source/schema modification and no production Docker/deployment change."
  - id: AC-7
    requirement: "Publication is bounded."
    evidence_required: "Implementation changes only authorized Compose/docs paths plus removal of legacy nested Compose; report is a separate report-only child on dev; main and branch topology remain unchanged."

verification:
