name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'Image-Data/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'Image-Data/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          BACKEND_URL: http://localhost:8000
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-fund

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: mongodb://localhost:27017/elitedrive

      - name: Build and test
        run: npm run build
        env:
          DATABASE_URL: mongodb://localhost:27017/elitedrive
          JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
          OTP_HASH_SECRET: ci-only-otp-hash-secret-ci-only-otp-hash-secret
