name: Frontend CI

on:
  push:
    branches: [dev]
    paths:
      - 'client/**'
      - 'server/scripts/sync-env.mjs'
      - 'server/scripts/sync-env.test.mjs'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        id: install
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund 2>&1 | tee /tmp/frontend-install.log

      - name: Environment synchronization tests
        id: env-sync
        run: |
          set -o pipefail
          npm run test:env-sync 2>&1 | tee /tmp/frontend-env-sync.log

      - name: Lint
        id: lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee /tmp/frontend-lint.log

      - name: Production dependency audit
        id: audit
        run: |
          set -o pipefail
          npm run security:audit:prod:report 2>&1 | tee /tmp/frontend-audit.log

      - name: Build and typecheck
        id: build
        run: |
          set -o pipefail
          npx next build 2>&1 | tee /tmp/frontend-build.log
        env:
          BACKEND_URL: http://localhost:8000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_MOMO_ENABLED: 'false'
