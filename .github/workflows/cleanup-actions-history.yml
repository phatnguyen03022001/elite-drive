name: Cleanup Actions history

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-actions-history.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-actions-history
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete completed workflow runs
    runs-on: ubuntu-latest
    steps:
      - name: Delete completed runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          ids_file="$(mktemp)"
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status == "completed") | .id' \
            > "$ids_file"

          total="$(wc -l < "$ids_file" | tr -d ' ')"
          deleted=0
          failed=0

          while IFS= read -r run_id; do
            [[ -z "$run_id" ]] && continue
            if gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
              >/dev/null 2>&1; then
              deleted=$((deleted + 1))
            else
              failed=$((failed + 1))
              echo "Failed to delete run ${run_id}" >&2
            fi
          done < "$ids_file"

          echo "Found ${total} completed runs; deleted ${deleted}; failed ${failed}."
          [[ "$failed" -eq 0 ]]
