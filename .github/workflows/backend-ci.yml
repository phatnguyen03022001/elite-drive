name: Backend CI

on:
  push:
    branches: [dev]
    paths:
      - 'server/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Backend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: mongodb://127.0.0.1:27017/elitedrive_integration?replicaSet=rs0
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      OTP_HASH_SECRET: ci-only-otp-hash-secret-ci-only-otp-hash-secret
      PLATFORM_USER_ID: 507f1f77bcf86cd799439011
      MAIL_TRANSPORT: console
      MOCK_PAYMENTS_ENABLED: 'true'
      NODE_ENV: test
      APP_PORT: '8000'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        id: install
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund 2>&1 | tee /tmp/backend-install.log

      - name: Typecheck and generate Prisma client
        id: typecheck
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee /tmp/backend-typecheck.log

      - name: Tests
        id: tests
        run: |
          set -o pipefail
          npm run test:ci 2>&1 | tee /tmp/backend-tests.log

      - name: Environment synchronization tests
        id: env-sync
        run: |
          set -o pipefail
          npm run test:env-sync 2>&1 | tee /tmp/backend-env-sync.log

      - name: Start MongoDB replica set
        id: mongo-start
        working-directory: .
        run: docker compose -f docker/mongodb/docker-compose.yml -p elite-drive-ci up -d

      - name: Wait for MongoDB PRIMARY
        id: mongo-ready
        working-directory: .
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if docker compose -f docker/mongodb/docker-compose.yml -p elite-drive-ci exec -T mongo \
              mongosh --quiet 'mongodb://localhost:27017/test?directConnection=true' \
              --eval 'if (rs.status().myState !== 1) throw new Error("MongoDB is not PRIMARY")' \
              >/dev/null 2>&1; then
              echo "MongoDB replica set is PRIMARY"
              exit 0
            fi
            sleep 1
          done
          echo "MongoDB replica set did not reach PRIMARY within 60 seconds"
          docker compose -f docker/mongodb/docker-compose.yml -p elite-drive-ci logs --no-color mongo mongo-init
          exit 1

      - name: Prepare disposable integration schema
        id: integration-schema
        run: npx prisma db push --schema=./prisma/schema.prisma --accept-data-loss --skip-generate

      - name: Real Mongo integration tests
        id: integration
        run: |
          set -o pipefail
          npm run test:integration 2>&1 | tee /tmp/backend-integration.log

      - name: Cleanup MongoDB
        if: ${{ always() }}
        working-directory: .
        run: |
          docker compose -f docker/mongodb/docker-compose.yml -p elite-drive-ci down --volumes --remove-orphans

      - name: Production dependency audit
        id: audit
        run: |
          set -o pipefail
          npm run security:audit:prod:report 2>&1 | tee /tmp/backend-audit.log

      - name: Build
        id: build
        run: |
          set -o pipefail
          npx nest build 2>&1 | tee /tmp/backend-build.log
