name: Backend CI

on:
  push:
    branches: [dev]
    paths:
      - 'server/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Backend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: mongodb://localhost:27017/elitedrive
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      OTP_HASH_SECRET: ci-only-otp-hash-secret-ci-only-otp-hash-secret
      PLATFORM_USER_ID: 507f1f77bcf86cd799439011
      MAIL_TRANSPORT: console
      MOCK_PAYMENTS_ENABLED: 'true'
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        id: install
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee /tmp/backend-install.log

      - name: Typecheck and generate Prisma client
        id: typecheck
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee /tmp/backend-typecheck.log

      - name: Tests
        id: tests
        run: |
          set -o pipefail
          npm run test:ci 2>&1 | tee /tmp/backend-tests.log

      - name: Environment synchronization tests
        id: env-sync
        run: |
          set -o pipefail
          npm run test:env-sync 2>&1 | tee /tmp/backend-env-sync.log

      - name: Production dependency audit
        id: audit
        run: |
          set -o pipefail
          npm run security:audit:prod:report 2>&1 | tee /tmp/backend-audit.log

      - name: Build
        id: build
        run: |
          set -o pipefail
          npx nest build 2>&1 | tee /tmp/backend-build.log
