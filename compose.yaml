name: elite-drive

services:
  app:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: elite-drive:local
    container_name: elite-drive
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: development
      APP_PORT: "8000"
      DATABASE_URL: mongodb://mongo:27017/elitedrive?replicaSet=rs0&directConnection=true
      JWT_SECRET: ${JWT_SECRET:-local-compose-jwt-not-a-secret}
      OTP_HASH_SECRET: ${OTP_HASH_SECRET:-local-compose-otp-not-a-secret}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CLOUDINARY_ENABLED: "false"
      BREVO_ENABLED: "false"
      MOMO_ENABLED: "false"
    ports:
      - "8000:8000"

  mongo:
    image: mongo:8.0
    container_name: elite-drive-mongo
    restart: unless-stopped
    environment:
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    tmpfs:
      - /data/configdb
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host localhost:27017 --eval "try { const status = rs.status(); quit(status.ok === 1 ? 0 : 1) } catch (e) { const result = rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}); quit(result.ok === 1 ? 1 : 2) }"
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  mongo-data:
    name: elite-drive-mongo-data
