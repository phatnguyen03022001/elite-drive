services:
  garage:
    image: dxflrs/garage:v1.0.0
    restart: unless-stopped
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - ./meta:/var/lib/garage/meta
      - ./data:/var/lib/garage/data
    ports:
      - "3900:3900"
      - "3903:3903"
    environment:
      GARAGE_RPC_PUBLIC_ADDR: "auto"
      GARAGE_RPC_SECRET: "${GARAGE_RPC_SECRET:?Set GARAGE_RPC_SECRET in docker/garage/.env}"
      GARAGE_ADMIN_TOKEN: "${GARAGE_ADMIN_TOKEN:?Set GARAGE_ADMIN_TOKEN in docker/garage/.env}"

  garage-ui:
    image: khairul169/garage-webui:latest
    restart: unless-stopped
    ports:
      - "3909:3909"
    environment:
      API_BASE_URL: "http://garage:3903"
      API_ADMIN_KEY: "${GARAGE_ADMIN_TOKEN:?Set GARAGE_ADMIN_TOKEN in docker/garage/.env}"
      S3_ENDPOINT_URL: "http://localhost:3900"
      AUTH_USER_PASS: "${GARAGE_UI_AUTH_USER_PASS:?Set GARAGE_UI_AUTH_USER_PASS in docker/garage/.env}"
    depends_on:
      - garage
